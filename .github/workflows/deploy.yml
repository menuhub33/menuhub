name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy MenuHub on the VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 179.67.197.9
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: /usr/local/bin/menuhub-deploy
